name: Import static site bundle
on:
  push:
    branches: [main]
    paths:
      - bundle.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d bundle.parts ]; then echo "Bundle parts are not present."; exit 1; fi
          cat bundle.parts/part-*.txt | tr -d '\r\n' | base64 -d > /tmp/kejutan-site.zip
          mkdir -p /tmp/kejutan-site
          unzip -oq /tmp/kejutan-site.zip -d /tmp/kejutan-site
          cp -a /tmp/kejutan-site/kejutan-18/. .
          rm -rf bundle.parts bundle.zip
          rm -f .github/workflows/import-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack static site source [skip ci]"
          git push
